backend:
  name: git-gateway
  branch: main

media_folder: "public/zach/uploads"
public_folder: "/zach/uploads"

site_url: https://shanelykins.com/zach
display_url: https://shanelykins.com/zach

collections:
  - name: "settings"
    label: "Site Content"
    files:
      - name: "projects"
        label: "Projects"
        file: "public/zach/data/projects.json"
        fields:
          - name: "projects"
            label: "Projects"
            label_singular: "Project"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "select", options: ["Shower", "Window", "Storefront", "Custom Glass", "Other"] }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Description", name: "description", widget: "text", required: false }
